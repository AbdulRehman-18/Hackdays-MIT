<div class="app" id="app">
  <!-- ============ sidebar ============ -->
  <aside class="side" id="side" aria-label="Sessions">
    <div class="side-head pywebview-drag-region">
      <span class="grow pywebview-drag-region"></span>
      <button class="icon-btn" id="side-close" aria-label="Hide sidebar" data-tip="Hide sidebar"><svg><use href="#i-panel"/></svg></button>
    </div>
    <nav class="side-nav" aria-label="Main">
      <a href="#/" class="nav-item" id="side-new"><svg><use href="#i-new"/></svg><span>New session</span><kbd>⌘K</kbd></a>
      <button class="nav-item" id="side-search-btn" type="button" aria-expanded="false"><svg><use href="#i-search"/></svg><span>Search</span></button>
      <label class="side-search" id="side-search-box" hidden><svg><use href="#i-search"/></svg><input id="side-search" placeholder="Search sessions" aria-label="Search sessions" autocomplete="off"></label>
      <a href="#/skills" class="nav-item" data-nav="skills"><svg><use href="#i-cube"/></svg><span>Skills</span></a>
      <a href="#/models" class="nav-item" data-nav="models"><svg><use href="#i-chip"/></svg><span>Models</span></a>
    </nav>
    <nav class="sessions" id="sessions" aria-label="Sessions"></nav>
    <div class="side-foot">
      <a href="#/settings" class="nav-item" data-nav="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></a>
      <div class="side-status" id="side-status" aria-live="polite">
        <span class="dot" id="status-dot"></span><span class="st-text"><b id="status-model">Connecting…</b><span id="status-sub">Ollama</span></span>
        <span class="grow"></span>
        <a href="#/evals" class="mini-link" data-nav="evals" data-tip="Evals"><svg><use href="#i-chart"/></svg></a>
        <a href="#/train" class="mini-link" data-nav="train" data-tip="Train"><svg><use href="#i-flask"/></svg></a>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- ============ main ============ -->
  <main class="main" id="main">
    <header class="top pywebview-drag-region">
      <button class="icon-btn" id="side-open" aria-label="Show sidebar" data-tip="Show sidebar"><svg><use href="#i-panel"/></svg></button>
      <div class="crumbs pywebview-drag-region" id="crumbs">
        <span class="title" id="top-title"></span>
        <span class="ws" id="top-ws" hidden></span>
      </div>
      <div class="top-center">
        <div class="seg seg-top" id="mode-seg" role="radiogroup" aria-label="Mode">
          <button type="button" role="radio" data-mode="code" aria-checked="true">Code</button>
          <button type="button" role="radio" data-mode="computer" aria-checked="false">Computer</button>
        </div>
      </div>
      <div class="top-right">
        <button class="voice-pill" id="voice-pill" hidden aria-label="Voice agent on. Stop it"><span class="live-dot"></span>Voice agent on<span class="sep">·</span><b>Stop</b></button>
        <div class="ctx" id="ctx" data-tip="Context used" hidden><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" class="trk"/><circle cx="10" cy="10" r="8" class="val" id="ctx-ring"/></svg><span id="ctx-text"></span></div>
      </div>
    </header>

    <!-- session view (also the new-session screen) -->
    <section class="view" id="view-session" aria-label="Session">
      <div class="scroller" id="scroller">
        <div class="column" id="thread" aria-live="polite"></div>
        <div class="column start" id="start" hidden></div>
      </div>
      <div class="composer-wrap" id="composer-wrap">
        <div class="column">
          <div class="mention-menu menu" id="mention" role="listbox" hidden></div>
          <form class="composer" id="composer" autocomplete="off">
            <div class="atts" id="atts" hidden></div>
            <textarea id="input" rows="1" placeholder="Ask Monday anything, @ to add files" aria-label="Message Monday"></textarea>
            <div class="comp-row">
              <button type="button" class="icon-btn round" id="attach-btn" aria-label="Attach files" data-tip="Attach files"><svg><use href="#i-plus"/></svg></button>
              <input type="file" id="file-input" multiple hidden>
              <div class="pop">
                <button type="button" class="chip" id="perm-btn" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-hand"/></svg><span id="perm-text">Ask for approval</span></button>
                <div class="menu menu-up" id="perm-menu" role="menu" hidden>
                  <button role="menuitemradio" data-approve="ask"><b>Ask for approval</b><span>Monday asks before edits, commands and risky actions.</span></button>
                  <button role="menuitemradio" data-approve="auto"><b>Auto-approve</b><span>Monday acts without asking. Dangerous commands stay blocked.</span></button>
                </div>
              </div>
              <span class="grow"></span>
              <div class="pop">
                <button type="button" class="chip model-btn" id="model-btn" aria-haspopup="menu" aria-expanded="false"><span class="dot" id="model-dot"></span><span id="model-name">Model</span><svg class="chev"><use href="#i-chev"/></svg></button>
                <div class="menu menu-up menu-right-up" id="model-menu" role="menu" hidden></div>
              </div>
              <button type="button" class="icon-btn round" id="mic-btn" aria-label="Hold to dictate" data-tip="Hold to dictate"><svg><use href="#i-mic"/></svg></button>
              <button type="submit" class="send" id="send-btn" aria-label="Send"><svg><use href="#i-up"/></svg></button>
            </div>
          </form>
          <div class="tray" id="tray">
            <div class="pop" id="proj-pop">
              <button type="button" class="tray-btn" id="proj-btn" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-folder"/></svg><span id="proj-text">Choose project</span><svg class="chev"><use href="#i-chev"/></svg></button>
              <div class="menu menu-up" id="proj-menu" role="menu" hidden></div>
            </div>
            <span class="tray-btn static" id="branch-chip" hidden><svg><use href="#i-branch"/></svg><span id="branch-text"></span></span>
            <span class="grow"></span>
            <button type="button" class="tray-btn" id="voice-btn"><svg><use href="#i-wave"/></svg><span id="voice-text">Voice agent</span></button>
          </div>
          <div class="cards-row" id="suggest" aria-label="Suggestions"></div>
        </div>
      </div>
    </section>

    <section class="view page" id="view-models" hidden></section>
    <section class="view page" id="view-skills" hidden></section>
    <section class="view page" id="view-evals" hidden></section>
    <section class="view page" id="view-train" hidden></section>
    <section class="view page" id="view-settings" hidden></section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/md.js"></script>
<script src="/static/app.js"></script>
<script src="/static/pages.js"></script>
</body>
</html>
