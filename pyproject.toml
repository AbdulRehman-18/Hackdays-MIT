[project]
name = "forge-harness"
version = "0.1.0"
description = "A harness that makes open-weight models like Gemma reliable at real device tasks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=1.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10",
    "pypdf>=4",
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "soundfile>=0.12",
    "kokoro-onnx>=0.4",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
    "opencv-python-headless>=4.9",
    "python-multipart>=0.0.9",
    "scipy>=1.11",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
media = ["rembg[cpu]>=2.0.50"]
app = ["pywebview>=5"]
# voice lock (forge enroll) and noise reduction before Whisper; both fail soft when missing
voicelock = ["resemblyzer>=0.1.4", "noisereduce>=3", "librosa>=0.10", "torch>=2"]

[project.scripts]
monday = "forge.cli:main"
forge = "forge.cli:main"  # the old name, kept working

[tool.uv]
link-mode = "copy"
# resemblyzer asks for webrtcvad (needs a compiler: webrtcvad-wheels ships the same module prebuilt) and the old
# "typing" backport (built into Python 3.11)
override-dependencies = ["webrtcvad; sys_platform == 'never'", "typing; sys_platform == 'never'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
